<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой Повар</title>
<link rel="stylesheet" href="style.css">
<script src="app.js?v=27"></script>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="logo">🍲 Мой Повар</div>
      <div class="sub">Домашняя еда рядом</div>
    </div>
    <button class="icon" id="profileBtn">👤</button>
  </header>

  <main>
    <section class="hero">
      <h1>Что хотите заказать?</h1>
      <div class="search">🔎 <input id="search" placeholder="Блюдо или кухня"></div>
    </section>

    <div class="chips">
      <button class="chip active" data-cat="all">Все</button>
      <button class="chip" data-cat="kazakh">🇰🇿 Казахская</button>
      <button class="chip" data-cat="european">🍝 Европейская</button>
      <button class="chip" data-cat="bakery">🍰 Выпечка</button>
    </div>

    <section>
      <div class="section-title"><h2>Популярные блюда</h2><span>›</span></div>
      <div class="cards" id="cards"></div>
    </section>

    <section class="cook-section">
      <div class="section-title"><h2>Лучшие повара</h2><span>›</span></div>
      <div class="cook-list">
        <div class="cook"><div class="avatar">👩‍🍳</div><div><b>Айгуль</b><small>Казахская кухня · ⭐ 4.9</small></div><button>Смотреть</button></div>
        <div class="cook"><div class="avatar">👨‍🍳</div><div><b>Марат</b><small>Европейская кухня · ⭐ 4.8</small></div><button>Смотреть</button></div>
      </div>
    </section>
  </main>

  <nav class="bottom">
    <button class="nav active">🏠<span>Главная</span></button>
    <button class="nav" onclick="showCart()">🛒<span>Корзина</span><em id="count">0</em></button>
    <button class="nav" id="ordersBtn">📦<span>Заказы</span></button>
    <button class="nav" id="profileNav">👤<span>Профиль</span></button>
  </nav>
</div>

<div class="modal hidden" id="modal">
  <div class="sheet">
    <button class="close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
